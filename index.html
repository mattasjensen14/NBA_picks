<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBA PICKS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-title" content="NBA PICKS">
<meta name="theme-color" content="#101212">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: the app's own look — sticky brand bar with section tabs, then one wide column of fixture rows that open into line tables. Single dark theme, like the app. */
:root{
  --bg:#101212;--surface:#181d1a;--raised:#1f2622;--line:#2c3630;--fg:#f0f3f1;--muted:#93a399;--faint:#6f8276;
  --accent:#71d68b;--accent-ink:#0f1c13;--win:#71d68b;--loss:#ef6b6b;--amber:#f2c14e;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:.5px}
.brand small{font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:4px}
.stamp{font-size:13px;color:var(--muted);text-align:right}
.stamp b{color:var(--fg);font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
nav a{flex:none;padding:8px 14px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;border:1px solid transparent}
nav a:hover{color:var(--fg);background:var(--raised)}
nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
nav a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:22px 48px}
h1{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:.3px;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);font-size:15px;margin:0 0 18px;max-width:70ch}
.note{font-size:14px;color:var(--muted)}
.warn{background:#2b2617;border:1px solid #4d4322;color:#ead79a;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.day{font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);margin:22px 0 6px;font-weight:600}
.fixture{display:grid;grid-template-columns:1fr auto minmax(140px,1.2fr) auto 1fr;align-items:center;gap:10px;width:100%;padding:14px 10px;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;cursor:pointer;text-align:center}
.fixture:hover{background:var(--surface)}
.fixture[aria-expanded="true"]{background:var(--surface);border-bottom-color:transparent}
.team{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.team img{width:54px;height:54px;object-fit:contain}
.team strong{font-size:16px}
.team small{color:var(--muted);font-size:13px;line-height:1.2}
.price{font-family:var(--display);font-size:30px;font-weight:700;min-width:62px;color:var(--fg)}
.price.on{color:var(--accent)}
.center b{display:block;font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.center small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.center .open{display:inline-block;margin-top:8px;padding:5px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-weight:600;color:var(--fg)}
.fixture[aria-expanded="true"] .open{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{background:var(--surface);border-bottom:1px solid var(--line);padding:6px 12px 16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding-block:8px 12px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
select,input{background:var(--raised);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:15px}
input[type=search]{min-width:0;width:180px}
.count{margin-left:auto;font-size:14px;color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--raised);text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:9px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.odds{font-family:var(--display);font-size:20px;font-weight:700}
.pct{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.meter{width:54px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.pos{color:var(--win);font-weight:600}.neg{color:var(--loss)}.dim{color:var(--faint)}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid var(--line)}
.chip.green{color:var(--win);border-color:#2f5a3b;background:#173021}.chip.red{color:var(--loss);border-color:#5a2f2f;background:#2e1919}.chip.amber{color:var(--amber);border-color:#594a24;background:#2a2412}.chip.muted{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-family:var(--display);font-size:26px;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h2 span{font-size:30px;color:var(--accent)}
.card .meta{font-size:14px;color:var(--muted);margin:2px 0 12px}
.leg{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.leg img{width:30px;height:30px;object-fit:contain}
.leg strong{display:block;font-size:15px}
.leg small{color:var(--muted);font-size:13px}
.leg .right{text-align:right;font-variant-numeric:tabular-nums}
.leg .right b{font-family:var(--display);font-size:20px}
.sub{font-size:1.15rem;margin:22px 0 4px}
.of{margin:6px 0 18px}.of-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px}.of-head .dim{font-size:.78rem}
.of-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.of-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.of-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.of-odds{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem}
.of-sub{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.78rem;color:var(--muted,#9daf9f);margin:2px 0}
.of-leg{border-top:1px solid var(--line);padding:6px 0 4px}.of-bar{height:5px;border-radius:3px;background:#26302a;margin-top:3px}.of-bar i{display:block;height:100%;border-radius:3px}
.tiles.tr-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tr-tiles .tile b{font-size:1.5rem}.tr-tiles .note{font-size:.75rem}
@media(min-width:900px){.tiles.tr-tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile small{display:block;font-size:13px;color:var(--muted);font-weight:600}
.tile b{font-family:var(--display);font-size:34px;font-weight:800}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto}
.chart svg{display:block;min-width:520px;width:100%;height:auto}
.lbar{position:relative;height:18px;min-width:200px}.lbar span{position:absolute;left:50%;top:-6px;bottom:-6px;border-left:1px dashed var(--faint)}.lbar i{position:absolute;top:0;height:100%;border-radius:4px}.lbar i.w{background:var(--win)}.lbar i.l{background:var(--loss)}
.lv-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline;margin-bottom:14px}
.lv-stamp{font-size:15px;color:var(--muted)}.lv-stamp b{color:var(--fg)}
.lv-leg{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;margin-top:10px;padding:10px 12px 10px 0;border:1px solid #2f4a37;border-radius:14px;overflow:hidden;
  background:radial-gradient(ellipse at 16% 75%,#214a31 0%,#102018 42%,#111a15 100%)}
.lv-photo{align-self:end;display:flex;justify-content:center;min-height:70px}.lv-photo img{width:96px;max-width:none;height:auto;display:block}
.lv-photo .lv-logo{width:56px;height:56px;object-fit:contain;align-self:center;margin:auto}
.lv-body{display:grid;gap:8px;min-width:0}
.lv-leg.lv-leg-ontrack{background:radial-gradient(ellipse at 16% 75%,#b56a1f 0%,#6e3f15 42%,#2a1b10 100%);border-color:#f0a14a}
.lv-tone{display:block;font-size:13px;font-weight:650;line-height:1.2;color:#b7c8be;margin-top:2px}.lv-tone.amber{color:#f3d16c}.lv-tone.green{color:#8bf0ae}.lv-tone.red{color:#ee9d98}
.lv-hidden{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px;color:var(--muted);margin:0 0 12px}.lv-hidden label{display:inline-flex;align-items:center;gap:6px;color:var(--fg);cursor:pointer}
.lv-status{display:flex;align-items:center;gap:10px;margin:2px 0 4px}
.lv-status b{font-family:var(--display);font-size:22px;white-space:nowrap}
.lv-seg{flex:1;display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--line)}
.lv-seg i{display:block;height:100%}.lv-seg .g{background:var(--win)}.lv-seg .o{background:#f0a14a}.lv-seg .r{background:var(--loss)}
.lv-keys{font-size:13px;color:var(--muted)}
.lv-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lv-top strong{font-size:17px;display:block}.lv-top small{color:var(--muted);font-size:14px}
.lv-val{text-align:right;line-height:1}.lv-val b{font-family:var(--display);font-size:38px;font-weight:800}.lv-val span{display:block;color:var(--muted);font-size:20px;font-weight:750;margin-top:5px;white-space:nowrap}
.lv-prog{height:6px;border-radius:6px;background:#34483b;overflow:hidden}.lv-prog i{display:block;height:100%;background:linear-gradient(90deg,#8af3b0,#70eaa0);border-radius:6px}
.lv-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.lv-game{display:flex;align-items:center;gap:8px}.lv-game>span:last-child{font-size:17px;font-weight:800;color:var(--fg)}.lv-game img{width:22px;height:22px}.lv-game b{color:var(--fg);font-variant-numeric:tabular-nums}
.lv-need{font-weight:700;color:var(--fg)}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--loss);margin-right:5px;vertical-align:middle}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.upd{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.update{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:9px 16px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.update:hover{filter:brightness(1.08)}.update:disabled{background:var(--raised);color:var(--muted);cursor:default}
.update-note{font-size:12px;color:var(--muted);max-width:240px;text-align:right}
td.c-model.hi .pct{color:var(--win);font-weight:800}td.c-model.hi .meter i{background:var(--win)}td.c-model:not(.hi) .meter i{background:var(--faint)}
.ev-badge{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:6px;background:#173021;border:1px solid #2f5a3b;color:var(--win);font-size:12px;font-weight:800;letter-spacing:.3px;vertical-align:middle}
table.lines tr:has(td.c-model.hi){border-color:#2f5a3b}
details.sg{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--bg)}details.sg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700;font-size:17px}details.sg>summary::-webkit-details-marker{display:none}details.sg>summary .sg-time{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:800}details.sg>summary .sg-n{margin-left:auto;color:var(--muted);font-size:14px;font-weight:600}details.sg>summary::after{content:'▾';color:var(--muted)}details.sg:not([open])>summary::after{content:'▸'}details.sg .scroll{margin:0 10px 10px}details.sg>summary img,details.sg>summary svg{width:28px;height:28px;object-fit:contain;flex:none}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
footer{border-top:1px solid var(--line);padding-block:18px 30px;color:var(--faint);font-size:13px}
@media (max-width:640px){
  .fixture{grid-template-columns:1fr auto 1fr;grid-template-areas:"a c h" "ap c hp";row-gap:2px}
  .fixture .team:first-child{grid-area:a}.fixture .team:last-child{grid-area:h}.fixture .price:nth-child(2){grid-area:ap}.fixture .price:nth-child(4){grid-area:hp}.fixture .center{grid-area:c}
  .team img{width:40px;height:40px}.team small{display:none}.price{font-size:22px}.center b{font-size:24px}
  h1{font-size:28px}.stamp{text-align:left}
}
/* Phone: tab bar at the bottom within thumb reach, line tables become cards. */
@media (max-width:640px){
  header{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;margin:0;justify-content:space-between;gap:2px;background:var(--surface);border-top:1px solid var(--line);
      padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  nav a{flex:1 1 0;text-align:center;padding:10px 2px;font-size:13px;border-radius:8px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  footer{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .bar{padding-block:10px}.brand b{font-size:24px}.stamp{font-size:12px}
  .panel{padding:4px 6px 12px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters label:last-of-type{grid-column:1/-1}.filters input[type=search]{width:100%}.count{grid-column:1/-1;margin:0}
  .scroll:has(table.lines){border:0;overflow:visible}
  table.lines thead{display:none}
  table.lines,table.lines tbody{display:block}
  table.lines tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
  table.lines td{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0;border:0;white-space:normal;font-size:14px}
  table.lines td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:13px}
  table.lines td.c-player{grid-column:1;font-size:16px;justify-content:flex-start}table.lines td.c-odds{grid-column:2;grid-row:1/3;font-size:28px;justify-content:flex-end}
  table.lines td.c-market{grid-column:1;color:var(--muted);justify-content:flex-start}table.lines td.c-model{grid-column:1/-1;font-size:16px;font-weight:700}
  table.lines td.c-model .meter{width:110px}
  input,select{font-size:16px}
}
@media (prefers-reduced-motion:no-preference){.panel{animation:open .18s ease-out}@keyframes open{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}}
.lv-leg.lv-leg-complete{background:radial-gradient(ellipse at 16% 75%,#669d2c 0%,#3f6822 42%,#1f3619 100%);border-color:#9bd35e}
@media (max-width:640px){.lv-leg{grid-template-columns:64px minmax(0,1fr);gap:8px}.lv-photo img{width:64px;max-width:100%}}
/* Phone (12 Nov 2026): the brand bar scrolls away instead of covering a quarter of the screen; snapshot time and
   Update now share one row; Game suggestions rows stay on one line. Desktop is unchanged. */
@media (max-width:640px){
  header{position:static}
  .bar{gap:6px 12px;padding-block:8px}
  .tools{width:100%;justify-content:space-between;flex-wrap:nowrap;gap:10px}
  .stamp{font-size:12px;line-height:1.35}.stamp b{white-space:nowrap}
  .update-note{font-size:11px}
  .lv-head{margin-bottom:8px}.lead{font-size:14px;margin-bottom:12px}
  details.sg>summary{gap:6px;padding:10px 12px;font-size:15px;flex-wrap:nowrap}
  details.sg>summary .sg-time{font-size:19px;white-space:nowrap}
  details.sg>summary img,details.sg>summary svg{width:22px;height:22px}
  details.sg>summary .sg-n{font-size:12px;white-space:nowrap}
  /* Live bongs: compact cards so more selections fit on one screen */
  .cards{gap:10px}.card{padding:10px 12px;border-radius:12px}
  .card h2{font-size:21px}.card h2 span{font-size:24px}.card .meta{font-size:12px;margin:0 0 6px}
  .lv-status{margin:0 0 2px;gap:8px}.lv-status b{font-size:17px}.lv-seg{height:7px}.lv-keys{font-size:12px}
  .lv-leg{grid-template-columns:42px minmax(0,1fr);gap:8px;margin-top:6px;padding:6px 10px 6px 0;border-radius:10px}
  .lv-photo{min-height:42px}.lv-photo img{width:42px}.lv-photo .lv-logo{width:30px;height:30px}
  .lv-body{gap:4px}
  .lv-top strong{font-size:15px;line-height:1.2}.lv-top small{font-size:12px;line-height:1.25}.lv-tone{font-size:12px;margin-top:1px}
  .lv-leg .lv-clock{display:none}
  .lv-val b{font-size:26px}.lv-val span{font-size:13px;margin-top:2px}
  .lv-prog{height:4px}
  .lv-foot{font-size:12px;gap:6px}.lv-game{gap:5px}.lv-game img{width:16px;height:16px}
}
.t-bad{color:#e59a94}.t-neutral{color:inherit}.t-light{color:#a9e6b8}.t-good{color:#71d68b}
.t-strong{color:#8bf0ae;background:rgba(113,214,139,.16);font-weight:800}
.t-orange{color:#f0a14a}.t-dgreen{color:#3fbf63;font-weight:700}.t-lgreen{color:#b6f8c8;background:rgba(113,214,139,.18);font-weight:800}
.bk-chip.t-orange{color:#f0a14a;border-color:#6a4a20}.bk-chip.t-dgreen{color:#3fbf63;border-color:#2c5a39}.bk-chip.t-lgreen{color:#b6f8c8;border-color:#4f8a60;background:rgba(113,214,139,.18)}
.bk-chance i.t-orange,.bk-mbar i.t-orange{background:#f0a14a}.bk-chance i.t-dgreen,.bk-mbar i.t-dgreen{background:#3fbf63}.bk-chance i.t-lgreen,.bk-mbar i.t-lgreen{background:#b6f8c8}
.bk-right small.t-lgreen,.lv-tone.t-lgreen,span.t-lgreen{background:none}
.t-bgreen{color:#34c759;font-weight:800}.t-blgreen{color:#a6dd6e;font-weight:800}.t-byellow{color:#f5c518;font-weight:800}.t-bred{color:#ee4b42;font-weight:800}
.bk-chip.t-bgreen{border-color:#34c75966;background:#34c7591f}.bk-chip.t-blgreen{border-color:#a6dd6e66;background:#a6dd6e1f}.bk-chip.t-byellow{border-color:#f5c51866;background:#f5c5181f}.bk-chip.t-bred{border-color:#ee4b4266;background:#ee4b421f}
.bk-chance i.t-bgreen{background:#34c759}.bk-chance i.t-blgreen{background:#a6dd6e}.bk-chance i.t-byellow{background:#f5c518}.bk-chance i.t-bred{background:#ee4b42}
td.key.t-bgreen{color:#34c759}td.key.t-blgreen{color:#a6dd6e}td.key.t-byellow{color:#f5c518}td.key.t-bred{color:#ee4b42}

/* Official bongs (locked 2 hours before the first game) on top of Live bongs, with the live number per leg */
function officialHtml(O){
  const chip=r=>r==='won'||r==='hit'?'<span class="chip green">'+(r==='won'?'Won':'Hit')+'</span>':r==='lost'||r==='miss'?'<span class="chip red">'+(r==='lost'?'Lost':'Miss')+'</span>':r==='void'?'<span class="chip muted">Void</span>':'';
  const leg=l=>{const over=l.side!=='Under',v=l.value,started=v!=null;const hit=started&&(over?v>l.line:v<l.line),fin=l.state==='post'||l.result;
    const done=l.result==='hit'||(over&&hit)||(fin&&hit),lost=l.result==='miss'||(!over&&started&&!hit)||(fin&&started&&!hit);
    const c=done?'#8bf0ae':lost?'#ee6b6b':'#f0a14a';const w=done?100:started&&l.line>0?Math.max(4,Math.min(100,over?100*v/l.line:100*(1-v/l.line))):0;
    return `<div class="of-leg"><div class="of-top"><span><strong>${esc(l.player)}</strong> <span class="dim">${esc(l.team)}</span></span><b>${num(l.odds,2)}</b></div>
      <div class="of-sub"><span>${esc(l.side)} ${num(l.line)} ${esc(l.stat)} · Model <b class="t-${toneOf('leg',l.model)}">${num(l.model)}%</b></span>${started?`<span style="color:${c};font-weight:700">${num(v,0)} / ${num(l.line)}${l.clock?' · '+esc(l.clock):''}</span>`:''}${chip(l.result)}</div>
      ${started?`<div class="of-bar"><i style="width:${w.toFixed(0)}%;background:${c}"></i></div>`:''}</div>`};
  return `<section class="of"><div class="of-head"><h2 class="sub" style="margin:0">Official bongs</h2><span class="dim">${esc(O.date)} · locked 2 h before the first game · never changed</span></div><div class="of-grid">`+
    O.bongs.map(b=>`<article class="of-card"><div class="of-top"><strong>${esc(b.title)}</strong><b class="of-odds">${num(b.odds,2)}</b></div><div class="of-sub"><span>Model ${num(b.model)}%</span>${chip(b.result)}</div>${b.legs.map(leg).join('')}</article>`).join('')+'</div></section>';
}

/* Phone: small bong cards three across (each opens to the full details when tapped). Desktop keeps the cards above. */
function mobileBongs(bongs,isLost,builder){
  const short=n=>{const p=String(n||'').replace(/\s+(Jr\.?|Sr\.?|II|III|IV)$/i,'').trim().split(/\s+/);return p.length>1?p.slice(1).join(' '):p[0]};
  const st=l=>l.complete?'g':isLost(l)?'r':l.ontrack?'o':'n';
  // the same progress line as the app's live cards: share of the line reached (Under: share of the limit used)
  const pct=l=>Math.max(0,Math.min(100,l.under?l.under.pct:(l.stat=='HCP'?0:(l.progress||0))));
  const tone=l=>l.complete?'g':isLost(l)?'r':l.under?(l.under.tone=='over'?'r':l.under.tone=='close'?'o':'g'):'g';
  const bar=l=>`<span class="ml-bar"><i class="${tone(l)}" style="width:${pct(l)}%"></i></span>`;
  const dot=l=>l.onCourt==null?'':`<i class="mcourt ${l.onCourt?'on':'off'}"></i>`;
  const pic=l=>dot(l)+(l.photo?`<img class="ml-av" src="${(DATA.photos||{})[l.photo]||l.photo}" alt="" loading="lazy">`:(DATA.logos[l.team]?`<img class="ml-av ml-logo" src="${DATA.logos[l.team]}" alt="">`:'<span class="ml-av"></span>'));
  const state=b=>b.won?'won':b.lost?'lost':b.legs.some(l=>l.live)?'live':'open';
  const label={won:'Won',lost:'Lost',live:'Live',open:'Pending'};
  return `<div class="m-bongs">${bongs.map(b=>{const g=b.legs.filter(l=>l.complete).length,s=state(b);
    return `<details class="mb ${s}"><summary><div class="mb-h"><b>${esc(b.title)}</b><span>${b.odds?num(b.odds,2):'—'}</span></div>${b.rating!=null?`<div class="mb-r r${b.rating>=8?'g':b.rating>=5?'o':'r'}">Rating ${b.rating}/10</div>`:''}${(b.warnings||[]).length?`<div class="bw">⚠ ${b.warnings.length>1?b.warnings.length+' warnings':'Warning'}</div>`:''}
      ${b.model!=null?`<div class="mb-m"><span class="mb-chip t-${toneOf('bong',b.model)}">Model ${num(b.model)}%</span><span class="mb-chip ${b.ev>0?'pos':'neg'}">EV ${b.ev>0?'+':''}${num(b.ev)}%</span></div>
      <div class="mb-c"><span class="mb-bar"><i class="t-${toneOf('bong',b.model)}" style="width:${Math.max(0,Math.min(100,b.model))}%"></i></span><b class="t-${toneOf('bong',b.model)}">${num(b.model)}%</b></div>`:''}
      ${s=='open'&&builder?`<div class="mb-s"><span>${b.legs.length} selections</span></div>`:`<div class="mb-s"><span>${s=='live'?'<i class="live-dot"></i>':''}${label[s]}</span><span>${g}/${b.legs.length}</span></div>`}
      ${b.legs.map(l=>`<div class="ml ${st(l)}">${pic(l)}<span class="ml-n">${esc(short(l.player))}</span><span class="ml-v"><b>${l.value??'–'}</b>/${num(l.line)} ${esc(l.stat)}</span>${bar(l)}</div>`).join('')}</summary>
      <div class="mb-d">${b.legs.map(l=>`<div class="md ${st(l)}">${pic(l)}<div class="md-main"><b>${esc(l.player)} · ${esc(l.side)} ${num(l.line)} ${esc(l.stat)}</b>
        <small class="md-st">${esc(l.status||'')}${l.minutes?` · ${esc(l.minutes)} min`:''}</small>
        <small><b class="md-clock">${l.live?'<i class="live-dot"></i>':''}${esc(l.final?'Final':(l.clock||''))}</b> · ${esc(l.away)} ${l.awayScore??''}–${l.homeScore??''} ${esc(l.home)}</small>
        ${bar(l)}<span class="md-need ${l.under&&!l.final?l.under.tone:''}">${esc(l.under&&!l.final?l.under.text:(l.needed||''))}</span></div>
        <span class="md-val"><b>${l.value??'–'}</b><small>${esc(l.stat)} / ${num(l.line)}</small></span></div>`).join('')}</div></details>`}).join('')}</div>`;
}
/* Increased numbers flash green and count up; a leg that turns into a hit pulses once. Earlier values are kept in
   localStorage (the page works without it). Respects prefers-reduced-motion. */
function liveEffects(){
  let prev={};try{prev=JSON.parse(localStorage.getItem('nbapicks.prev')||'{}')}catch(e){}
  const still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;const next={};
  document.querySelectorAll('.lv-leg[data-k]').forEach(el=>{
    const k=el.dataset.k,v=el.dataset.v===''?null:Number(el.dataset.v),c=el.dataset.c==='1',old=prev[k];
    next[k]={v,c};if(!old)return;
    const b=el.querySelector('.lv-val b');
    if(v!=null&&old.v!=null&&v>old.v&&b&&!still){b.classList.add('bump');const from=old.v,start=performance.now();
      const step=t=>{const f=Math.min(1,(t-start)/1200);b.textContent=Math.round(from+(v-from)*f);if(f<1)requestAnimationFrame(step);else b.textContent=v};requestAnimationFrame(step);}
    if(c&&!old.c&&!still)el.classList.add('pulse');
  });
  try{localStorage.setItem('nbapicks.prev',JSON.stringify(next))}catch(e){}
}
/* "Updated 2 min ago": amber after 5 minutes, red after 15. */
function freshness(){
  const el=document.getElementById('lv-ago');const iso=DATA.live&&DATA.live.fetchedIso;if(!el||!iso)return;
  const mins=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/60000));
  el.innerHTML=`Statistics updated <b>${mins<1?'just now':mins<60?mins+' min ago':Math.floor(mins/60)+' h ago'}</b> · ESPN`;
  el.classList.toggle('amber',mins>5&&mins<=15);el.classList.toggle('red',mins>15);el.title='Updated '+(DATA.live.fetched||'');
}
setInterval(freshness,30000);

    (DATA.games.length?Object.entries(byDay).map(([d,gs])=>`<div class="day">${esc(d)}</div>`+gs.map(game).join('')).join(''):'<div class="empty">No upcoming games in this snapshot.</div>');
  document.querySelectorAll('details.sg').forEach(d=>d.addEventListener('toggle',()=>{d.open?opened.add(d.dataset.key):opened.delete(d.dataset.key);store.set('sg-open',JSON.stringify([...opened]));}));
  const save=()=>{store.set('sg-filter',JSON.stringify(F));const y=scrollY;renderSuggestions();scrollTo(0,y)};
  $('#sg-min').addEventListener('change',e=>{F.min=e.target.value;save()});
  document.querySelectorAll('.sg-chip').forEach(b=>b.addEventListener('click',()=>{const c=b.dataset.chip;F.chips=F.chips.includes(c)?F.chips.filter(x=>x!==c):[...F.chips,c];save()}));
}

/* ---------- Expert picks (not shown on the public page) ---------- */

  // same bong-card style as the app's Expert picks: big odds, Model % and EV chips, chance bar, one row per leg
  const p=DATA.expert;const photo=l=>l.photo?((DATA.photos||{})[l.photo]||l.photo):null;
  const pctBar=(v,kind)=>`<div class="bk-mbar"><i class="t-${toneOf(kind,v)}" style="width:${Math.max(0,Math.min(100,v||0))}%"></i></div>`;
  $('#view').innerHTML=`<h1>Expert picks</h1><p class="lead">Three bongs for ${esc(p[0]?.date||'the next game day')}: odds above 7, every selection Model % over 60 with positive Model EV, odds from 1.10, at most 7 selections, no player used twice.</p>`+
  (p.length?`<div class="bk-grid">${p.map((b,i)=>`<article class="bk-card">
    <div class="bk-title">Bong ${i+1}</div><div class="bk-odds"><small>Odds</small><b>${num(b.odds,2)}</b></div>
    <div class="bk-chips"><span class="bk-chip t-${toneOf('model',b.estimate)}">Model ${num(b.estimate)}%</span><span class="bk-chip t-${toneOf('ev',b.ev)}">EV ${b.ev>0?'+':''}${num(b.ev)}%</span><span class="bk-chip">${b.legs.length} selections</span></div>
    <div class="bk-chance" title="Combined Model %"><i class="t-${toneOf('model',b.estimate)}" style="width:${Math.max(0,Math.min(100,b.estimate||0))}%"></i></div>
    ${b.legs.map(l=>`<div class="bk-leg" style="--stripe:${(DATA.teamColors||{})[l.team]||'transparent'}">${photo(l)?`<img class="bk-ph" src="${photo(l)}" alt="">`:`<span class="bk-ph">${logo(l.team)}</span>`}
      <div style="min-width:0"><span class="bk-name">${esc(l.player)}</span><span class="bk-meta">${logo(l.team)}${esc(l.team)} · ${esc(l.stat)} ${esc(l.side)} ${num(l.line)}</span></div>
      <div class="bk-right"><b>${num(l.odds,2)}</b><small class="t-${toneOf('leg',l.model)}">${num(l.model)}%</small>${pctBar(l.model,'leg')}</div></div>`).join('')}</article>`).join('')}</div>`
  :'<div class="empty">No expert bongs could be built from this snapshot.</div>');
}

/* ---------- Earnings ---------- */
function renderEarnings(){
  const e=DATA.earnings;
  $('#view').innerHTML=`<h1>Earnings</h1><p class="lead">Profit/loss is returned payout minus stake, in NOK, for settled bongs.</p>
  <div class="tiles"><div class="tile"><small>Total profit / loss</small><b class="${e.profit>0?'pos':e.profit<0?'neg':''}">${money(e.profit)} NOK</b></div>
  <div class="tile"><small>Settled stake</small><b>${money(e.stake).replace('+','')} NOK</b></div>
  <div class="tile"><small>ROI</small><b>${e.roi==null?'—':(e.roi>0?'+':'')+num(e.roi)+'%'}</b></div>
  <div class="tile"><small>Pending bongs</small><b>${e.pending}</b></div></div>
  ${ledger(e.series)}`;
}
function ledger(series){
  if(!series.length)return '<div class="empty">No settled bongs yet.</div>';
  const wins=series.filter(s=>s.profit>0).length;const odds=series.filter(s=>s.odds).map(s=>s.odds);const avg=odds.length?odds.reduce((a,b)=>a+b,0)/odds.length:null;
  const widest=Math.max(...series.map(s=>Math.abs(s.profit)))||1;let run=0;
  const tiles=`<div class="tiles"><div class="tile"><small>Bongs won</small><b>${wins} of ${series.length}</b><div class="note">${Math.round(100*wins/series.length)}% hit rate</div></div>
    <div class="tile"><small>Average odds</small><b>${avg?num(avg,2):'—'}</b><div class="note">${odds.length} of ${series.length} bongs have known odds</div></div>
    <div class="tile"><small>Needed to break even</small><b>${avg?Math.round(100/avg)+'%':'—'}</b><div class="note">hit rate required at the average odds</div></div>
    <div class="tile"><small>Biggest win</small><b class="pos">${money(Math.max(...series.map(s=>s.profit)))}</b><div class="note">NOK</div></div></div>`;
  const rows=series.map(s=>{run+=s.profit;const w=48*Math.abs(s.profit)/widest;const r=s.profit>0?'Won':s.profit<0?'Lost':'Even';
    return `<tr><td><strong>${esc(s.bong)}</strong><br><span class="dim">${esc(s.date)}</span></td><td class="num">${money(s.stake).replace('+','')}</td><td class="num">${s.odds?num(s.odds,2):'—'}</td>
      <td><span class="chip ${r=='Won'?'green':r=='Lost'?'red':'muted'}">${r}</span></td>
      <td><div class="lbar"><span></span>${s.profit?`<i class="${s.profit>0?'w':'l'}" style="${s.profit>0?'left':'right'}:50%;width:${w.toFixed(1)}%"></i>`:''}</div></td>
      <td class="num ${s.profit>0?'pos':s.profit<0?'neg':''}"><b>${money(s.profit)}</b></td><td class="num ${run>0?'pos':run<0?'neg':''}"><b>${money(run)}</b></td></tr>`}).join('');
  return tiles+`<div class="scroll"><table><thead><tr><th>Bong</th><th class="num">Stake</th><th class="num">Odds</th><th>Result</th><th style="text-align:center;min-width:200px">Profit / loss</th><th class="num">NOK</th><th class="num">Running total</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* ---------- Track record: does the model work? (no stakes or NOK) ---------- */
function renderTrack(){
  const T=DATA.track;
  if(!T){$('#view').innerHTML='<h1>Track record</h1><div class="empty">No settled lines yet.</div>';return;}
  const p=v=>v==null?'—':num(v)+'%';const sp=v=>v==null?'—':(v>0?'+':'')+num(v)+'%';
  const res=r=>r==='won'||r==='hit'?'<span class="chip green">'+(r==='won'?'Won':'Hit')+'</span>':r==='lost'||r==='miss'?'<span class="chip red">'+(r==='lost'?'Lost':'Miss')+'</span>':r==='void'?'<span class="chip muted">Void</span>':'<span class="chip muted">Pending</span>';
  const S=T.officialSummary||{};
  const tiles=`<div class="tiles tr-tiles"><div class="tile"><small>Settled lines</small><b>${T.lines.toLocaleString('en')}</b><div class="note">${T.days} game days · every imported Unibet line, Model % saved before tip-off</div></div>
    <div class="tile"><small>Hit rate</small><b>${p(T.hit)}</b><div class="note">expected ${p(T.expected)} (average Model %)</div></div>
    <div class="tile"><small>Brier score · model vs Unibet</small><b>${num(T.brier,3)} · ${T.unibetBrier==null?'—':num(T.unibetBrier,3)}</b><div class="note">lower is better · 0.250 is a coin flip</div></div>
    <div class="tile"><small>Official bongs</small><b>${S.settled?`${S.won} of ${S.settled} won`:'—'}</b><div class="note">${S.settled?`expected ${num(S.expected,1)} wins (sum of Model %)`:'locked daily 2 hours before the first game'}</div></div></div>`;
  const dot=(x,y)=>[30+(x-40)/60*260,190-y/100*170];
  const pts=(rows,key,fill,shape)=>rows.filter(r=>r[key]!=null&&r.hit!=null).map(r=>{const [x,y]=dot(r[key],r.hit);return shape==='d'?`<rect x="${x-5}" y="${y-5}" width="10" height="10" transform="rotate(45 ${x} ${y})" fill="${fill}"/>`:`<circle cx="${x}" cy="${y}" r="6" fill="${fill}"/>`}).join('');
  const svg=`<svg viewBox="0 0 300 210" style="width:100%;max-width:520px;display:block;margin:6px 0" role="img" aria-label="Calibration chart"><line x1="30" y1="${dot(40,40)[1]}" x2="290" y2="${dot(100,100)[1]}" stroke="#5f6f64" stroke-dasharray="5 4"/>
    <line x1="30" y1="190" x2="290" y2="190" stroke="#3a4e40"/><text x="160" y="206" fill="#9daf9f" font-size="10" text-anchor="middle">Chance given (%) · 40 → 100</text><text x="8" y="100" fill="#9daf9f" font-size="10" transform="rotate(-90 8 100)" text-anchor="middle">Actual hit %</text>
    ${pts(T.unibetCalibration||[],'unibet','#9daf9f','d')}${pts(T.calibration,'model','#71d68b','c')}</svg><div class="dim" style="font-size:.78rem">● green = NBA PICKS Model % · ◆ grey = Unibet's own price · on the dashed line = honest</div>`;
  const cal=`<h2 class="sub">Calibration</h2><p class="lead">Lines grouped by Model %. If the model is right, lines at 70 % hit about 70 % of the time.</p>${svg}<div class="scroll"><table><thead><tr><th>Model %</th><th class="num">Lines</th><th class="num">Model %</th><th class="num">Hit %</th><th class="num">Unibet %</th></tr></thead><tbody>`+
    T.calibration.map(r=>`<tr><td>${esc(r.bucket)}</td><td class="num">${r.lines}</td><td class="num">${p(r.model)}</td><td class="num"><b>${p(r.hit)}</b></td><td class="num">${p(r.unibet)}</td></tr>`).join('')+'</tbody></table></div>';
  const clv=`<h2 class="sub">Closing line value</h2><p class="lead">Did Unibet lower the odds after the line was picked? Falling odds mean the market moved towards the model: the clearest early sign that it sees something.</p><div class="tiles tr-tiles">`+
    Object.values(T.clv).map(c=>`<div class="tile"><small>${esc(c.label)}</small><b class="${c.avg>0?'pos':c.avg<0?'neg':''}">${sp(c.avg)}</b><div class="note">average CLV · ${c.n} lines · odds fell ${p(c.fell)}, rose ${p(c.rose)}</div></div>`).join('')+'</div>';
  const off=`<h2 class="sub">Official bongs</h2><p class="lead">Three bongs locked once a day, 2 hours before the first game, and never changed.</p>`+(T.official.length?`<div class="bk-grid">${T.official.map(b=>`<article class="bk-card"><div class="bk-title">${esc(b.title)} · ${esc(b.date)}</div><div class="bk-odds"><small>Odds</small><b>${num(b.odds,2)}</b></div>
    <div class="bk-chips"><span class="bk-chip">Model ${p(b.model)}</span>${res(b.result)}</div>
    ${b.legs.map(l=>`<div class="bk-leg"><span class="bk-ph">${logo(l.team)}</span><div style="min-width:0"><span class="bk-name">${esc(l.player)}</span><span class="bk-meta">${esc(l.team)} · ${esc(l.stat)} ${esc(l.side)} ${num(l.line)}${l.value!=null?` · got ${num(l.value,0)}`:''}</span></div><div class="bk-right"><b>${num(l.odds,2)}</b><small>${p(l.model)}</small>${l.result?res(l.result):''}</div></div>`).join('')}</article>`).join('')}</div>`:'<div class="empty">The first official bongs are locked 2 hours before the next first game.</div>');
  const daysTable=`<h2 class="sub">Over time</h2><div class="scroll"><table><thead><tr><th>Date</th><th class="num">Hit %</th><th class="num">Expected</th><th class="num">CLV</th></tr></thead><tbody>`+
    T.perDay.slice().reverse().map(r=>`<tr><td>${esc(r.date)}</td><td class="num"><b>${p(r.hit)}</b></td><td class="num">${p(r.expected)}</td><td class="num ${r.clv>0?'pos':r.clv<0?'neg':''}">${sp(r.clv)}</td></tr>`).join('')+'</tbody></table></div>';
  const grp=(title,rows,key)=>`<h2 class="sub">${title}</h2><div class="scroll"><table><thead><tr><th>${key==='date'?'Date':'Stat'}</th><th class="num">Lines</th><th class="num">Hit %</th><th class="num">Expected %</th></tr></thead><tbody>`+
    rows.map(r=>`<tr><td>${esc(r[key])}</td><td class="num">${r.lines}</td><td class="num"><b>${p(r.hit)}</b></td><td class="num">${p(r.expected)}</td></tr>`).join('')+'</tbody></table></div>';
  $('#view').innerHTML=`<h1>Track record</h1><p class="lead">How the NBA PICKS model has done on real Unibet lines. Estimates, not guarantees; nothing here places bets.</p>`+tiles+off+cal+clv+daysTable+grp('Per stat',T.perStat,'stat');
}
const views={live:renderLive,builder:renderBuilder,games:renderGames,suggestions:renderSuggestions,track:renderTrack,earnings:renderEarnings};   // Expert picks is not on this page
// Public copy: no money (no stakes, possible wins or Earnings). Its Update now only loads the newest published version.
if(!DATA.earnings){delete views.earnings;document.querySelector('nav a[href="#earnings"]')?.remove();}
function route(){
  const name=(location.hash||'#live').slice(1);const view=views[name]?name:'live';
  document.querySelectorAll('nav a').forEach(a=>{if(a.getAttribute('href')=='#'+view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  views[view]();
}
window.addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();   // a new tab starts at the top

/* ---------- Update now: asks the owner's Claude session to rebuild and republish this page ---------- */
(async()=>{
  const btn=$('#update'),note=$('#update-note');
  if(DATA.public){
    note.textContent='Rebuilt every 2 minutes during games.';
    btn.addEventListener('click',()=>{btn.disabled=true;btn.textContent='Updating…';note.textContent='Loading the newest version…';
      const url=new URL(location.href);url.searchParams.set('t',Date.now());location.replace(url.toString())});
    return;}
  let comments=null;
  try{comments=window.claude?.use?await window.claude.use('comments'):null}catch(e){}
  if(!comments){
    btn.addEventListener('click',()=>{note.textContent='Reloading the latest published page. Fresh live statistics require the owner’s Mac and Claude session.';window.location.reload()});
    return;
  }
  let state='off';try{state=await comments.canSendToClaude()}catch(e){}
  if(state==='writers_only'||state==='off'){
    btn.addEventListener('click',()=>{note.textContent='Reloading the latest published page. Only the owner can request fresh live statistics in this view.';window.location.reload()});
    return;
  }
  const show=s=>{btn.disabled=false;note.textContent=s==='available'?'':'Updates need the Mac and Claude session to be on.'};
  show(state);
  btn.addEventListener('click',async()=>{
    btn.disabled=true;note.textContent='Asking for an update…';
    try{
      const anchor=await comments.anchorFor(btn);
      await comments.sendToClaude({anchor,text:'UPDATE LIVE BONGS: fast refresh of live statistics (share_refresh.py live), then republish.'});
      btn.textContent='Updating…';note.textContent='Live numbers update in about 20 seconds; the page reloads by itself.';
    }catch(e){
      btn.disabled=false;
      note.textContent=e&&e.code==='consent_required'?'Allow the page to comment for you, then press again.':e&&e.code==='rate_limited'?'Just updated. Try again in a minute.':e&&e.code==='claude_unavailable'?'Updates need the Mac and Claude session to be on.':'Update could not be requested. Try again.';
      try{show(await comments.canSendToClaude())}catch(_){}
    }
  });
})();
</script>
